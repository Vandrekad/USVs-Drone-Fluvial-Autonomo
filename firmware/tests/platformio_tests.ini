; PlatformIO Test Environments - USV-AM Firmware
; Uso: pio run -c tests/platformio_tests.ini -e <env_name>
;
; Cada environment compila apenas o main de teste + módulos necessários.
; O src_dir aponta para o teste, e src_filter inclui os módulos dependentes.

[platformio]
src_dir = .
default_envs = test_sensors, test_net, test_navigation, test_commands, test_storage, test_utils, test_state

[common]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    mobizt/Firebase Arduino Client Library for ESP8266 and ESP32 @ ^4.4.14
    bblanchon/ArduinoJson @ ^7.0.4
build_flags =
    -I src

; ─────────────────────────────────────────────────────────────
; TEST: sensors (GPS, bússola, ultrassônico, motores)
; ─────────────────────────────────────────────────────────────
[env:test_sensors]
extends = common
build_src_filter =
    +<tests/test_sensors/main.cpp>
    +<src/modules/sensors/sensors.cpp>
    +<src/modules/state/state.cpp>
    +<src/modules/utils/utils.cpp>
    +<src/modules/navigation/navigation.cpp>
    +<src/modules/net/wifi_manager.cpp>
    +<src/modules/net/firebase_manager.cpp>
    +<src/modules/storage/storage.cpp>

; ─────────────────────────────────────────────────────────────
; TEST: net (WiFi + Firebase RTDB)
; ─────────────────────────────────────────────────────────────
[env:test_net]
extends = common
build_src_filter =
    +<tests/test_net/main.cpp>
    +<src/modules/net/wifi_manager.cpp>
    +<src/modules/net/firebase_manager.cpp>
    +<src/modules/state/state.cpp>
    +<src/modules/sensors/sensors.cpp>
    +<src/modules/navigation/navigation.cpp>
    +<src/modules/utils/utils.cpp>
    +<src/modules/storage/storage.cpp>

; ─────────────────────────────────────────────────────────────
; TEST: navigation (LOS, distância, controle de rumo)
; ─────────────────────────────────────────────────────────────
[env:test_navigation]
extends = common
build_src_filter =
    +<tests/test_navigation/main.cpp>
    +<src/modules/navigation/navigation.cpp>
    +<src/modules/state/state.cpp>
    +<src/modules/utils/utils.cpp>
    +<src/modules/net/wifi_manager.cpp>
    +<src/modules/net/firebase_manager.cpp>
    +<src/modules/sensors/sensors.cpp>
    +<src/modules/storage/storage.cpp>

; ─────────────────────────────────────────────────────────────
; TEST: commands (processamento de comandos RTDB)
; ─────────────────────────────────────────────────────────────
[env:test_commands]
extends = common
build_src_filter =
    +<tests/test_commands/main.cpp>
    +<src/modules/commands/commands.cpp>
    +<src/modules/state/state.cpp>
    +<src/modules/navigation/navigation.cpp>
    +<src/modules/net/wifi_manager.cpp>
    +<src/modules/net/firebase_manager.cpp>
    +<src/modules/utils/utils.cpp>
    +<src/modules/sensors/sensors.cpp>
    +<src/modules/storage/storage.cpp>

; ─────────────────────────────────────────────────────────────
; TEST: storage (LittleFS, buffer offline, flush)
; ─────────────────────────────────────────────────────────────
[env:test_storage]
extends = common
build_src_filter =
    +<tests/test_storage/main.cpp>
    +<src/modules/storage/storage.cpp>
    +<src/modules/state/state.cpp>
    +<src/modules/utils/utils.cpp>
    +<src/modules/net/wifi_manager.cpp>
    +<src/modules/net/firebase_manager.cpp>
    +<src/modules/sensors/sensors.cpp>
    +<src/modules/navigation/navigation.cpp>

; ─────────────────────────────────────────────────────────────
; TEST: utils (math, SHA256, NMEA parser)
; ─────────────────────────────────────────────────────────────
[env:test_utils]
extends = common
build_src_filter =
    +<tests/test_utils/main.cpp>
    +<src/modules/utils/utils.cpp>
    +<src/modules/state/state.cpp>
    +<src/modules/navigation/navigation.cpp>
    +<src/modules/net/wifi_manager.cpp>
    +<src/modules/net/firebase_manager.cpp>
    +<src/modules/sensors/sensors.cpp>
    +<src/modules/storage/storage.cpp>

; ─────────────────────────────────────────────────────────────
; TEST: state (variáveis globais de estado)
; ─────────────────────────────────────────────────────────────
[env:test_state]
extends = common
